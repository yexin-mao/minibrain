<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}minibrain{% endblock %}</title>
<script src="/static/htmx.min.js"></script>
<link rel="stylesheet" href="/static/remixicon/remixicon.css">
<style>
  :root {
    --bg: #fbfaf7; --panel: #fffefa; --panel-subtle: #f6f5f1;
    --fg: #1b1d24; --muted: #777c88; --muted-strong: #4d5360;
    --border: #e6e3dc; --border-strong: #d5d2ca;
    --accent: #4566c2; --accent-strong: #3554ad; --accent-soft: #edf1fb;
    --accent-2: #4e9276; --ink: #171a22; --ink-soft: #252936;
    --danger: #c93232; --danger-soft: #fef0f0; --ok: #07885f; --ok-soft: #eaf8f2;
    --warning: #a15c00; --warning-soft: #fff5e5; --code-bg: #eef2f6;
    --shadow-sm: 0 1px 2px rgba(20, 24, 32, .025);
    --shadow-md: 0 12px 32px rgba(43, 49, 64, .055);
  }
  * { box-sizing: border-box; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 38%, transparent); outline-offset: 2px; }
  body {
    margin: 0; color: var(--fg);
    background: var(--bg);
    font: 15px/1.58 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; overflow-x: hidden;
  }
  header {
    background: rgba(251, 250, 247, .96);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
    backdrop-filter: blur(10px);
  }
  .header-inner {
    max-width: 1320px; min-height: 72px; margin: 0 auto; padding: 0 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  header .brand { color: var(--ink); font-weight: 780; letter-spacing: -.35px; display: inline-flex; align-items: center; gap: 9px; }
  header .brand:hover { text-decoration: none; }
  .brand-symbol {
    display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    color: #fff; background: var(--accent);
    box-shadow: 0 5px 14px rgba(69, 102, 194, .18); font-size: 16px;
  }
  header .who { color: var(--muted); font-size: 13px; }
  .header-actions, .nav-links { display: flex; align-items: center; gap: 6px; }
  .header-actions { flex: 1; min-width: 0; justify-content: flex-end; }
  .nav-links { max-width: 100%; }
  .nav-link {
    color: var(--muted-strong); font-size: 13px; font-weight: 580;
    padding: 10px 12px; border-radius: 0; position: relative; white-space: nowrap;
  }
  .nav-link:hover { color: var(--fg); background: transparent; text-decoration: none; }
  .nav-link.is-active { color: var(--accent-strong); background: transparent; }
  .nav-link.is-active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 2px; height: 2px; background: var(--accent); border-radius: 99px; }
  main { max-width: 1180px; margin: 0 auto; padding: 54px 28px 72px; }
  .page-heading { margin-bottom: 22px; }
  .eyebrow {
    color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; margin-bottom: 5px;
  }
  h1 { margin: 0; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.16; letter-spacing: -.045em; }
  .page-heading p { color: var(--muted); margin: 7px 0 0; max-width: 720px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px; margin-bottom: 22px; box-shadow: var(--shadow-sm);
  }
  .card-primary { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.02em; }
  .card .hint, .hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .card-header .hint { margin: 0; max-width: 760px; }
  .route-guide { display: flex; flex-wrap: wrap; gap: 8px; margin: -2px 0 16px; }
  .route-item {
    display: inline-flex; align-items: center; gap: 7px; color: var(--muted-strong);
    background: var(--panel-subtle); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 11px; font-size: 12px;
  }
  .route-item strong { color: var(--fg); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea, button {
    font: inherit; border-radius: 9px; border: 1px solid var(--border-strong);
    padding: 10px 12px; background: var(--panel-subtle); color: var(--fg); width: 100%;
  }
  input:hover, select:hover, textarea:hover { border-color: color-mix(in srgb, var(--accent) 36%, var(--border-strong)); }
  textarea { resize: vertical; min-height: 76px; }
  button {
    background: var(--accent); color: #fff; border: 1px solid transparent;
    cursor: pointer; font-weight: 680; width: auto; padding: 10px 18px;
    box-shadow: 0 8px 18px rgba(79, 91, 213, .17); transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
  }
  button:hover { background: var(--accent-strong); transform: translateY(-1px); box-shadow: 0 10px 24px rgba(69, 102, 194, .18); }
  button:disabled { cursor: not-allowed; opacity: .55; }
  .button-ghost { background: transparent; color: var(--muted-strong); border-color: transparent; }
  .button-ghost:hover { background: var(--panel-subtle); color: var(--fg); box-shadow: none; transform: none; }
  .button-secondary { background: var(--panel-subtle); color: var(--fg); border-color: var(--border-strong); }
  .button-secondary:hover { background: var(--code-bg); box-shadow: none; transform: none; }
  .button-danger { background: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 34%, var(--border)); }
  .button-danger:hover { background: var(--danger-soft); }
  .button-small { padding: 4px 8px; font-size: 12px; border-radius: 7px; }
  .button-small { white-space: nowrap; }
  .row { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
  .row > div { flex: 1; }
  .upload-grid { display: grid; grid-template-columns: 1.05fr 1.05fr 2fr auto; gap: 12px; align-items: end; }
  .source-grid { display: grid; grid-template-columns: .8fr 1.4fr .9fr auto; gap: 12px; align-items: end; }
  .composer { border: 1px solid var(--border-strong); border-radius: 10px; background: #fffefa; overflow: hidden; transition: border-color .16s ease, box-shadow .16s ease; }
  .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 68%, var(--border)); box-shadow: 0 0 0 4px rgba(79, 91, 213, .09); }
  .composer textarea { min-height: 132px; border: 0; border-radius: 0; background: transparent; padding: 17px 18px; font-size: 15px; }
  .composer textarea:focus-visible { outline: none; }
  .composer-actions {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    border-top: 1px solid var(--border); padding: 9px 10px 9px 14px;
  }
  .composer-actions .hint { margin: 0; }
  .support-copy { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .table-wrap { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 9px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: 11px; font-weight: 720; letter-spacing: .035em; text-transform: uppercase; white-space: nowrap; }
  tbody tr { transition: background .14s ease; }
  tbody tr:hover { background: #fafbfe; }
  tr:last-child td { border-bottom: 0; }
  .tag { display: inline-flex; font-size: 11px; padding: 2px 7px; border-radius: 20px; border: 1px solid var(--border); }
  .tag-private { color: var(--muted-strong); background: var(--panel-subtle); }
  .tag-public { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .status { display: inline-flex; align-items: center; font-weight: 650; }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: currentColor; margin-right: 6px; }
  .st-ready { color: var(--ok); }
  .st-failed, .st-dead_letter { color: var(--danger); }
  .st-succeeded { color: var(--ok); } .st-running { color: var(--muted); }
  .st-processing, .st-uploaded { color: var(--warning); }
  .st-building, .st-stale { color: var(--warning); }
  .error { color: var(--danger); font-size: 13px; padding: 8px 0; }
  .empty-state { color: var(--muted); padding: 22px 4px 8px; text-align: center; }
  .empty-state strong { display: block; color: var(--fg); font-size: 14px; margin-bottom: 3px; }
  .source-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .source-group { background: var(--panel-subtle); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .source-group-title { color: var(--muted); font-size: 12px; font-weight: 650; margin-bottom: 8px; }
  .source-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 30px; }
  .source-empty { color: var(--muted); font-size: 12px; }
  .evidence { border-left: 3px solid var(--accent); padding: 6px 0 6px 12px; margin: 10px 0; }
  .evidence .meta { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .evidence .snippet {
    font-size: 13px; white-space: pre-wrap; word-break: break-word;
    max-height: 150px; overflow: auto;
  }
  pre, code {
    background: var(--code-bg); border-radius: 5px; font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  pre { padding: 9px 11px; overflow-x: auto; }
  code { padding: 1px 5px; }
  .answer { white-space: pre-wrap; margin: 8px 0 4px; }
  .wiki-list { display: grid; gap: 8px; }
  .wiki-list-item {
    display: flex; align-items: center; justify-content: space-between; gap: 18px;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    color: var(--fg); background: var(--panel-subtle);
  }
  .wiki-list-item:hover { border-color: var(--accent); text-decoration: none; }
  .wiki-list-item small { display: block; color: var(--muted); margin-top: 2px; }
  .wiki-main { max-width: 880px; }
  .wiki-article { padding: clamp(22px, 5vw, 48px); }
  .wiki-article .card-header { align-items: center; }
  .wiki-article h1 { font-size: clamp(25px, 4vw, 38px); }
  .wiki-meta { color: var(--muted); font-size: 12px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
  .wiki-warning { color: var(--warning); background: var(--warning-soft); border-radius: 8px; padding: 10px 12px; }
  .wiki-content { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.75; margin-top: 22px; }
  .wiki-answer-block { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
  .wiki-references { margin-top: 16px; }
  .wiki-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .wiki-stat { border-top: 1px solid var(--border); padding-top: 12px; }
  .wiki-stat strong { display: block; font-size: 24px; letter-spacing: -.03em; }
  .wiki-stat span { color: var(--muted); font-size: 12px; }
  .wiki-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .wiki-links a { border: 1px solid var(--border); border-radius: 999px; padding: 5px 9px; font-size: 12px; }
  .wiki-event { display: flex; justify-content: space-between; gap: 18px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .wiki-event:last-child { border-bottom: 0; }
  .htmx-request .spinner { display: inline; }
  .spinner { display: none; color: var(--muted); font-size: 13px; margin-left: 10px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .hero {
    margin: 0 auto 36px; padding: 18px 20px 6px; text-align: center;
    color: var(--fg); background: transparent; border: 0; box-shadow: none;
  }
  .hero::after { display: none; }
  .hero .eyebrow { margin-bottom: 12px; }
  .hero h1 { max-width: 860px; margin: 0 auto; font-size: clamp(30px, 3.7vw, 44px); letter-spacing: -.055em; }
  .hero-summary { color: var(--muted); font-size: 14px; line-height: 1.75; max-width: 760px; margin: 16px auto 0; }
  .section-kicker { color: var(--accent); font-size: 11px; font-weight: 760; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 6px; }
  .question-card { padding: 24px; margin-bottom: 20px; }
  .question-card .card-header { align-items: center; }
  .question-card .card-header h2 { font-size: 20px; }
  .question-card #answer:empty { display: none; }
  .question-card #answer:not(:empty) { border-top: 1px solid var(--border); margin-top: 22px; }
  .retrieval-paths { margin: 0 0 28px; scroll-margin-top: 96px; }
  .path-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 18px; align-items: center; min-height: 82px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .path-icon { display: grid; place-items: center; width: 44px; height: 44px; color: var(--accent-strong); background: #f0f2f5; border-radius: 50%; font-size: 21px; }
  .path-copy strong { display: block; font-size: 15px; margin-bottom: 3px; }
  .path-copy span { display: block; color: var(--muted); font-size: 13px; }
  .path-state { color: var(--accent-2); background: #f4f8f5; border: 1px solid #dce8e0; border-radius: 7px; padding: 5px 9px; font-size: 12px; font-weight: 650; }
  .prompt-section { margin: 0 2px 48px; }
  .prompt-heading { color: var(--muted-strong); font-size: 13px; font-weight: 700; margin-bottom: 11px; scroll-margin-top: 110px; }
  .quick-prompts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; }
  .quick-prompt {
    width: auto; padding: 7px 11px; color: var(--muted-strong); background: transparent; border-color: var(--border);
    border-radius: 7px; box-shadow: none; font-size: 12px; font-weight: 560;
  }
  .quick-prompt:hover { color: var(--accent-strong); background: var(--accent-soft); border-color: #cbd5ef; transform: none; box-shadow: none; }
  .knowledge-section { margin-top: 0; padding-top: 32px; border-top: 1px solid var(--border); }
  .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 2px 14px; }
  .section-heading h2 { margin: 0; font-size: 23px; letter-spacing: -.035em; }
  .section-heading p { color: var(--muted); margin: 5px 0 0; }
  .table-card { overflow: hidden; }
  .table-card .table-wrap { margin: 0 -4px -4px; }
  .subtle-note { color: var(--muted); font-size: 12px; }
  .lab-intro { max-width: 760px; margin-bottom: 20px; }
  .lab-form-grid { display: grid; grid-template-columns: 1.25fr .8fr .8fr .8fr; gap: 12px; align-items: end; }
  .option-row { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 12px 0 16px; }
  .option-row label { display: inline-flex; gap: 8px; align-items: center; margin: 0; color: var(--muted-strong); }
  .option-row input { width: auto; }
  @media (max-width: 920px) {
    .grid, .source-list, .wiki-stats { grid-template-columns: 1fr; }
    .lab-form-grid { grid-template-columns: 1fr 1fr; }
    .upload-grid, .source-grid { grid-template-columns: 1fr 1fr; }
    .upload-grid .file-field, .source-grid .name-field { grid-column: 1 / -1; }
    .header-inner { padding: 0 20px; }
    .header-actions { min-width: 0; }
    .nav-links { overflow-x: auto; scrollbar-width: none; }
    .nav-links::-webkit-scrollbar { display: none; }
    header .who { display: none; }
  }
  @media (max-width: 640px) {
    main { padding: 30px 14px 48px; }
    .header-inner {
      min-height: 62px; padding: 10px 14px; flex-direction: column; align-items: stretch; gap: 6px;
    }
    .header-actions { width: 100%; align-items: stretch; }
    .nav-links { width: 100%; overflow-x: auto; justify-content: flex-start; }
    .nav-link { white-space: nowrap; }
    header .who { display: none; }
    .card { padding: 17px; border-radius: 12px; }
    .card-header { align-items: flex-start; }
    .upload-grid, .source-grid { grid-template-columns: 1fr; }
    .upload-grid .file-field, .source-grid .name-field { grid-column: auto; }
    .upload-grid button, .source-grid button { width: 100%; }
    .composer-actions { align-items: flex-start; flex-direction: column; }
    .composer-actions button { width: 100%; }
    .hero { padding: 6px 4px 0; margin-bottom: 28px; }
    .hero h1 { font-size: 31px; line-height: 1.22; }
    .hero-summary { font-size: 13px; }
    .question-card .card-header { gap: 10px; }
    .path-row { grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 12px 4px; }
    .path-icon { width: 40px; height: 40px; }
    .path-state { grid-column: 2; justify-self: start; margin-top: -6px; }
    .section-heading { align-items: flex-start; flex-direction: column; }
    .lab-form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
