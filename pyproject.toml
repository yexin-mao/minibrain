[project]
name = "minibrain"
version = "0.1.0"
description = "最小知识中台：两条范式不同的检索链路 + 统一身份与权限边界 + 一个 Agent 入口"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2.0",
  "psycopg_pool>=3.2.0",
  "bcrypt>=4.2.0",
  "openai>=1.40.0",
  "numpy>=1.26.0",
  "pypdf>=6.15.0",
  "langgraph>=1.2.10",
  "langchain>=1.3.14",
  "langchain-openai>=1.4.1",
  "langgraph-checkpoint-postgres>=3.1.1",
  "llama-index-core>=0.14.23",
  "llama-index-embeddings-openai>=0.6.0",
  "llama-index-vector-stores-postgres>=0.8.1",
  "llama-index-retrievers-bm25>=0.7.1",
  "llama-index-llms-openai>=0.7.10",
]

[project.scripts]
minibrain-init-db = "minibrain.scripts_init_db:main"
minibrain-create-user = "minibrain.scripts_create_user:main"
minibrain-purge = "minibrain.scripts_purge:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/minibrain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
