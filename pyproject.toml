[project]
name = "minibrain"
version = "0.1.0"
description = "最小知识中台：两条范式不同的检索链路 + 统一身份与权限边界 + 一个 Agent 入口"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2.0",
  "psycopg_pool>=3.2.0",
  "bcrypt>=4.2.0",
  "openai>=1.40.0",
  "numpy>=1.26.0",
]

[project.scripts]
minibrain-init-db = "minibrain.scripts_init_db:main"
minibrain-create-user = "minibrain.scripts_create_user:main"
minibrain-purge = "minibrain.scripts_purge:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/minibrain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
