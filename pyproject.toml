[project]
name = "minibrain"
version = "0.1.0"
description = "最小知识中台：两条范式不同的检索链路 + 统一身份与权限边界 + 一个 Agent 入口"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2.0",
  "psycopg_pool>=3.2.0",
  "bcrypt>=4.2.0",
  "openai>=1.40.0",
  "numpy>=1.26.0",
  "tiktoken>=0.8.0",
  "pypdf>=6.15.0",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "langgraph>=1.2.10",
  "langchain>=1.3.14",
  "langchain-openai>=1.4.1",
  "langgraph-checkpoint-postgres>=3.1.1",
  "llama-index-core>=0.14.23",
  "llama-index-embeddings-openai>=0.6.0",
  "llama-index-vector-stores-postgres>=0.8.1",
  "llama-index-retrievers-bm25>=0.7.1",
  "llama-index-llms-openai>=0.7.10",
  "llama-index-llms-openai-like>=0.7.2",
]

[project.optional-dependencies]
# 本地 cross-encoder 重排。★ 刻意做成可选 extra，不进核心依赖：
# torch + sentence-transformers 约 2GB，而项目其余部分全部走 API、零本地模型。
# 让「跑一次消融」的成本落在需要它的人身上，不落在每个 `uv sync` 上。
#
#   uv sync --extra rerank-ce
#
# 没装时 `MinibrainCrossEncoderRerank` 会抛带安装提示的 ModuleError，
# 相关测试自动 skip —— 和「没配 API key 时文档落 failed」是同一种降级纪律。
rerank-ce = [
  "sentence-transformers>=3.0.0",
  "torch>=2.2.0",
]

# 官方小型公开检索集的下载和 parquet 读取；不进入线上运行依赖。
public-eval = [
  "huggingface-hub>=1.0.0",
  "pyarrow>=18.0.0",
]

[project.scripts]
minibrain-init-db = "minibrain.scripts_init_db:main"
minibrain-create-user = "minibrain.scripts_create_user:main"
minibrain-purge = "minibrain.scripts_purge:main"
minibrain-reindex-lexical = "minibrain.scripts_reindex_lexical:main"
minibrain-worker = "minibrain.scripts_worker:main"
minibrain-index-audit = "minibrain.scripts_index_audit:main"
minibrain-index-manifest = "minibrain.scripts_index_manifest:main"
minibrain-seed-demo = "minibrain.scripts_seed_demo:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.12.0,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"

[tool.ruff.lint]
# 先把确定性的语法、名称和导入问题作为 CI 基线；更强的风格规则分批治理，
# 避免一次机械改写整个实验仓库。
select = ["E4", "E7", "E9", "F"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/minibrain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
